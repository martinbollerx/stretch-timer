<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stretch Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}

/* Layout: single centered column — current stretch photo, ring countdown, round transport controls, then a compact progress list */
:root{
  --bg:#f6f4f2; --surface:#ffffff; --fg:#1f1d1c; --muted:#7a726c; --line:#e6e0db;
  --accent:#e8572a; --accent-soft:#fdebe4; --rest:#3b7d8c; --rest-soft:#e3f0f2;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171514; --surface:#221f1d; --fg:#f2eeeb; --muted:#a39a94; --line:#37322f;
  --accent:#f26a3f; --accent-soft:#3a231b; --rest:#6fb3c2; --rest-soft:#1b2e32; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171514; --surface:#221f1d; --fg:#f2eeeb; --muted:#a39a94; --line:#37322f;
  --accent:#f26a3f; --accent-soft:#3a231b; --rest:#6fb3c2; --rest-soft:#1b2e32; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:440px;margin:0 auto;padding-block:24px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
header{display:flex;flex-direction:column;align-items:center;gap:2px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;margin:0}
.meta{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}

.stage{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:16px}
.photo{width:100%;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;background:var(--line);position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.who{display:flex;flex-direction:column;align-items:center;gap:2px}
.label{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.name{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.05;text-wrap:balance}
.detail{color:var(--muted);font-size:.95rem}

.ringbox{position:relative;width:min(230px,64vw);aspect-ratio:1;max-width:100%}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.track{fill:none;stroke:var(--line);stroke-width:8}
.prog{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke .3s}
.stage.rest .prog{stroke:var(--rest)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.phase{font-family:var(--display);font-weight:600;font-size:.95rem;letter-spacing:.16em;text-transform:uppercase;padding:2px 12px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.stage.rest .phase{background:var(--rest-soft);color:var(--rest)}
.count{font-family:var(--display);font-weight:700;font-size:5.4rem;line-height:.95;font-variant-numeric:tabular-nums}
.unit{font-size:.4em;color:var(--muted);margin-left:2px}

.controls{display:flex;align-items:center;justify-content:center;gap:18px}
button{font:inherit;cursor:pointer;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:50%;width:52px;height:52px;display:grid;place-items:center;padding:0}
button svg{width:22px;height:22px;fill:currentColor}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.play{width:78px;height:78px;background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 6px 18px -8px var(--accent)}
.play svg{width:32px;height:32px}
.play:hover{border-color:var(--accent);filter:brightness(1.05)}
.toggle{display:flex;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;cursor:pointer}
.toggles{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.toggle input{accent-color:var(--accent);width:17px;height:17px}

.progress{width:100%;display:flex;flex-direction:column;gap:4px}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:10px 16px;border-radius:12px;text-align:left}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:.85rem;font-weight:400;margin-left:6px}
.row.now{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent)}
.row.done .t{color:var(--muted)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line)}
.dot.sep{margin-left:6px}
.dot.done{background:var(--accent);border-color:var(--accent)}
.dot.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note{color:var(--muted);font-size:.85rem;max-width:36ch;margin:0}
.credit a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.credit a:hover{text-decoration-color:var(--muted)}
@media (prefers-reduced-motion:reduce){.prog{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Stretch Timer</h1>
    <span class="meta" id="total"></span>
  </header>

  <section class="stage" id="stage" aria-live="polite">
    <div class="who">
      <div class="label" id="lbl">First up</div>
      <div class="name" id="name">Pancake</div>
      <div class="detail" id="detail">Rep 1 of 2</div>
    </div>
    <div class="ringbox">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="52"/>
        <circle class="prog" id="prog" cx="60" cy="60" r="52"/>
      </svg>
      <div class="center">
        <span class="phase" id="phase">Ready</span>
        <span class="count" id="count">5<span class="unit">s</span></span>
      </div>
    </div>
    <div class="controls">
      <button id="reset" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
      <button id="back" aria-label="Previous stretch"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 6v12z"/></svg></button>
      <button class="play" id="go" aria-label="Start"><svg viewBox="0 0 24 24" id="goicon"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="skip" aria-label="Next stretch"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z"/></svg></button>
    </div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="snd" checked> Beeps</label>
      <label class="toggle"><input type="checkbox" id="mus" checked> Music</label>
    </div>
  </section>

  <section class="progress" id="seq" aria-label="Progress"></section>
  <p class="note">30s hold, 10s break between holds, 5s to get ready at the start. Want your own music? Untick Music, start your music app, then press play.</p>
  <p class="note credit">Music by <a href="https://pixabay.com/users/harumachimusic-13470593/?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=112199" target="_blank" rel="noopener">Noru</a> from <a href="https://pixabay.com//?utm_source=link-attribution&utm_medium=referral&utm_campaign=music&utm_content=112199" target="_blank" rel="noopener">Pixabay</a>.</p>
</div>

<script>
const HOLD=30, REST=10, PREP=5;
const STRETCH=[
  {k:'pancake',name:'Pancake',sides:null},
  {k:'fig4',name:'Figure 4',sides:['Right','Left']},
  {k:'hip',name:'Hip Flexor',sides:['Right','Left']},
  {k:'chest',name:'Chest Stretch',sides:null},
  {k:'lat',name:'Lat Stretch',sides:null},
];
// Both reps on one side, then the other side (R,R,L,L)
const holds=[];
STRETCH.forEach((s,si)=>{(s.sides||[null]).forEach(side=>{for(let r=1;r<=2;r++)holds.push({...s,si,rep:r,side});});});
const steps=[{type:'prep',dur:PREP,h:0}];
holds.forEach((h,i)=>{steps.push({type:'hold',dur:HOLD,h:i});if(i<holds.length-1)steps.push({type:'rest',dur:REST,h:i+1});});
const totalSec=holds.length*HOLD+(holds.length-1)*REST;
const $=id=>document.getElementById(id);
$('total').textContent=`5 stretches · ${holds.length} holds · ${Math.floor(totalSec/60)}:${String(totalSec%60).padStart(2,'0')} min`;

const C=2*Math.PI*52; $('prog').style.strokeDasharray=C;
let idx=0, remain=steps[0].dur, running=false, timer=null, wake=null, finished=false, actx=null;
const ICON_PLAY='<path d="M8 5v14l11-7z"/>', ICON_PAUSE='<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>', ICON_AGAIN='<path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>';

function desc(h){const p=[];if(h.side)p.push(h.side+' side');p.push(`Rep ${h.rep} of 2`);return p.join(' · ');}

// progress rows: one per stretch, one dot per hold
const seqEl=$('seq'); const rows=[]; const dots=[];
STRETCH.forEach((s,si)=>{
  const row=document.createElement('div');row.className='row';
  row.innerHTML=`<span class="t">${s.name}${s.sides?'<span class="s">R / L</span>':''}</span><span class="dots"></span>`;
  const dwrap=row.querySelector('.dots');
  holds.forEach((h,i)=>{if(h.si!==si)return;const d=document.createElement('span');d.className='dot'+(h.side==='Left'&&h.rep===1?' sep':'');d.title=desc(h);dwrap.appendChild(d);dots[i]=d;});
  seqEl.appendChild(row);rows.push(row);
});

function render(){
  const st=steps[idx], h=holds[st.h];
  $('stage').classList.toggle('rest',st.type!=='hold');
  if(finished){
    $('phase').textContent='Done';$('count').innerHTML='✓';
    $('lbl').textContent='Session complete';$('name').textContent='Nice work';$('detail').textContent='Tick today on your sheet';
    $('prog').style.strokeDashoffset=0;
  } else {
    $('phase').textContent=st.type==='hold'?'Hold':st.type==='rest'?'Break':(running?'Get ready':'Ready');
    $('count').innerHTML=`${Math.ceil(remain)}<span class="unit">s</span>`;
    $('lbl').textContent=st.type==='hold'?'Now':(idx===0?'First up':'Up next');
    $('name').textContent=h.name;$('detail').textContent=desc(h);
    $('prog').style.strokeDashoffset=C*(1-remain/st.dur);
  }
  $('goicon').innerHTML=finished?ICON_AGAIN:running?ICON_PAUSE:ICON_PLAY;
  $('go').setAttribute('aria-label',finished?'Start again':running?'Pause':'Start');
  const cur=finished?holds.length:st.h;
  dots.forEach((d,i)=>{d.classList.toggle('done',i<cur);d.classList.toggle('now',!finished&&i===cur);});
  rows.forEach((r,si)=>{
    const mine=holds.map((x,i)=>x.si===si?i:-1).filter(i=>i>=0);
    r.classList.toggle('done',mine.every(i=>i<cur));
    r.classList.toggle('now',!finished&&holds[cur]&&holds[cur].si===si);
  });
}

// Beeps go through a boost + limiter so they can be louder than a plain full-scale tone without distorting
let beepBus=null;
function beepOut(){
  if(beepBus)return beepBus;
  const boost=actx.createGain();boost.gain.value=2.5;
  const lim=actx.createDynamicsCompressor();
  lim.threshold.value=-8;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.08;
  boost.connect(lim).connect(actx.destination);
  return beepBus=boost;
}
function beep(freq=880,len=.12,vol=.25){
  if(!$('snd').checked||!actx)return;
  try{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.type='sine';
  g.gain.setValueAtTime(vol,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+len);
  o.connect(g).connect(beepOut());o.start();o.stop(actx.currentTime+len);}catch(e){}
}
// Background music: "Peaceful Garden" by Noru (Pixabay), looped for the whole session
let music=null;
function musicStart(){
  if(!$('mus').checked)return;
  if(!music){music=new Audio('audio/peaceful-garden.mp3');music.loop=true;music.preload='auto';music.volume=.7;}
  music.play().catch(()=>{});
}
function musicStop(){if(music)music.pause();}
function announce(){const st=steps[idx];if(st.type==='hold')beep(1046,.35,1);else if(st.type==='rest')beep(523,.35,1);}
async function keepAwake(on){
  try{
    if(on&&'wakeLock' in navigator&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null);}
    if(!on&&wake){await wake.release();wake=null;}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&running){keepAwake(true);if(actx&&actx.state!=='running')actx.resume().catch(()=>{});tick();}
});

// Timing runs off the real clock (endAt), so time spent in another app is counted when you come back.
let endAt=0, raf=0;
// The ring redraws every frame from the real clock; the 100ms tick only drives step changes, beeps and text
function animateRing(){
  if(!running){raf=0;return;}
  const st=steps[idx], r=Math.min(st.dur,Math.max(0,(endAt-Date.now())/1000));
  $('prog').style.strokeDashoffset=C*(1-r/st.dur);
  raf=requestAnimationFrame(animateRing);
}
function tick(){
  if(!running)return;
  const now=Date.now();
  let r=(endAt-now)/1000, advanced=0;
  while(r<=0){
    if(idx>=steps.length-1){remain=0;finish();return;}
    idx++; r+=steps[idx].dur; endAt+=steps[idx].dur*1000; advanced++;
  }
  const before=Math.ceil(remain); remain=r; const after=Math.ceil(remain);
  if(advanced){
    // only sound the change if it just happened, not when catching up after a while away
    if(advanced===1&&steps[idx].dur-r<1.5)announce();
  } else if(after!==before&&after<=3&&after>0)beep(660,.1,1);
  render();
}
function finish(){running=false;clearInterval(timer);musicStop();finished=true;keepAwake(false);beep(1318,.6,1);render();}
function initAudio(){
  // Let beeps mix with music from other apps (Safari / iOS 17+); ignored elsewhere
  try{if(navigator.audioSession)navigator.audioSession.type='ambient';}catch(e){}
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});
}
function start(){
  initAudio();
  if(finished)reset();
  running=true;endAt=Date.now()+remain*1000;keepAwake(true);musicStart();
  clearInterval(timer);timer=setInterval(tick,100);render();if(!raf)raf=requestAnimationFrame(animateRing);
}
function pause(){
  if(running)remain=Math.max(0,(endAt-Date.now())/1000);
  running=false;clearInterval(timer);keepAwake(false);musicStop();render();
}
function jump(d){
  finished=false;
  let target=idx+d;
  if(d>0){while(target<steps.length&&steps[target].type!=='hold')target++;}
  else{while(target>0&&steps[target].type!=='hold')target--;}
  if(target>=steps.length){finish();return;}
  idx=Math.max(0,target);remain=steps[idx].dur;
  if(running){endAt=Date.now()+remain*1000;announce();}
  render();
}
function reset(){pause();idx=0;remain=steps[0].dur;finished=false;render();}

$('go').onclick=()=>running?pause():start();
$('skip').onclick=()=>jump(1);
$('back').onclick=()=>jump(-1);
$('reset').onclick=reset;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='INPUT'){e.preventDefault();$('go').click();}});
try{const s=localStorage.getItem('snd');if(s!==null)$('snd').checked=s==='1';const u=localStorage.getItem('mus');if(u!==null)$('mus').checked=u==='1';}catch(e){}
$('mus').onchange=e=>{try{localStorage.setItem('mus',e.target.checked?'1':'0')}catch(_){}if(running){e.target.checked?musicStart():musicStop();}};
$('snd').onchange=e=>{try{localStorage.setItem('snd',e.target.checked?'1':'0')}catch(_){}}
render();
</script>
</body>
</html>
